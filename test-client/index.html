<!DOCTYPE html>
<html>
<head>
  <title>EvenUp — Live Test Client</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    #log { border: 1px solid #ccc; padding: 12px; height: 300px; overflow-y: auto; background: #f9f9f9; }
    .event { margin-bottom: 8px; padding: 8px; background: #e8f5e9; border-radius: 4px; }
    input, button { padding: 8px; margin: 4px 0; }
  </style>
</head>
<body>
  <h2>EvenUp — Live Expense Feed</h2>
  <p>Group ID: <input type="number" id="groupId" value="1" /> <button onclick="joinGroup()">Join Group</button></p>
  <p id="status">Not joined yet.</p>
  <div id="log"></div>

  <!-- Socket.io client library, served automatically by our own server -->
  <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  <script>
    const socket = io('http://localhost:3000');
    const log = document.getElementById('log');
    const status = document.getElementById('status');

    socket.on('connect', () => {
      status.textContent = `Connected (socket id: ${socket.id}). Now click "Join Group".`;
    });

    function joinGroup() {
      const groupId = document.getElementById('groupId').value;
      socket.emit('join_group', groupId);
      status.textContent = `Joined group:${groupId}. Waiting for live expense updates...`;
    }

    socket.on('expense_added', (expense) => {
      const div = document.createElement('div');
      div.className = 'event';
      div.textContent = `New expense: "${expense.description}" — ₹${expense.amount} (paid by user ${expense.paid_by})`;
      log.prepend(div);
    });
  </script>
</body>
</html>
