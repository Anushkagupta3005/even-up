<!DOCTYPE html>
<html>
<head>
  <title>EvenUp — Live Test Client</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    #log { border: 1px solid #ccc; padding: 12px; min-height: 300px; overflow-y: auto; background: #f9f9f9; }
    .event { margin-bottom: 8px; padding: 8px; border-radius: 4px; }
    .added { background: #e8f5e9; }
    .pending { background: #fff8e1; }
    .vote { background: #e3f2fd; }
    .approved { background: #c8e6c9; font-weight: bold; }
    .rejected { background: #ffcdd2; font-weight: bold; }
    input, button { padding: 8px; margin: 4px 0; }
    .vote-btns button { margin-right: 6px; }
  </style>
</head>
<body>
  <h2>EvenUp — Live Expense Feed</h2>
  <p>Group ID: <input type="number" id="groupId" value="1" /> <button onclick="joinGroup()">Join Group</button></p>
  <p id="status">Not joined yet.</p>

  <p>
    Vote as user:
    <input type="number" id="voterId" value="2" style="width:60px" />
    on expense:
    <input type="number" id="voteExpenseId" value="1" style="width:60px" />
    <span class="vote-btns">
      <button onclick="castVote('approve')">Approve</button>
      <button onclick="castVote('reject')">Reject</button>
    </span>
  </p>

  <div id="log"></div>

  <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  <script>
    const socket = io('http://localhost:3000');
    const log = document.getElementById('log');
    const status = document.getElementById('status');
    let currentGroupId = null;

    socket.on('connect', () => {
      status.textContent = `Connected (socket id: ${socket.id}). Now click "Join Group".`;
    });

    function joinGroup() {
      currentGroupId = document.getElementById('groupId').value;
      socket.emit('join_group', currentGroupId);
      status.textContent = `Joined group:${currentGroupId}. Waiting for live expense updates...`;
    }

    function castVote(vote) {
      const groupId = document.getElementById('groupId').value;
      const expenseId = document.getElementById('voteExpenseId').value;
      const userId = Number(document.getElementById('voterId').value);
      fetch(`http://localhost:3000/api/groups/${groupId}/expenses/${expenseId}/vote`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, vote }),
      })
        .then((r) => r.json())
        .then((data) => console.log('vote response', data))
        .catch((err) => console.error(err));
    }

    function addLogEntry(className, text) {
      const div = document.createElement('div');
      div.className = `event ${className}`;
      div.textContent = text;
      log.prepend(div);
    }

    socket.on('expense_added', (expense) => {
      addLogEntry('added', `✅ Expense added: "${expense.description}" — ₹${expense.amount} (paid by user ${expense.paid_by})`);
    });

    socket.on('expense_pending', (expense) => {
      addLogEntry('pending', `⏳ PENDING approval: "${expense.description}" — ₹${expense.amount} (expense #${expense.id}, needs ${expense.votes_needed}/${expense.total_members} votes)`);
    });

    socket.on('expense_vote_cast', (data) => {
      addLogEntry('vote', `🗳️ Vote cast on expense #${data.expense_id} — approve: ${data.approve_count}, reject: ${data.reject_count} (needs ${data.votes_needed}/${data.total_members})`);
    });

    socket.on('expense_approved', (expense) => {
      addLogEntry('approved', `✔️ APPROVED: "${expense.description}" — ₹${expense.amount} (${expense.approve_count} approve votes)`);
    });

    socket.on('expense_rejected', (expense) => {
      addLogEntry('rejected', `❌ REJECTED: "${expense.description}" — ₹${expense.amount} (${expense.reject_count} reject votes)`);
    });
  </script>
</body>
</html>
